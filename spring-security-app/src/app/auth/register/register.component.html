<div class="login-container">
  <div class="login-card">

    <h2>Create Account</h2>

    <div class="error-alert" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="success-alert" *ngIf="successMessage">{{ successMessage }}</div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Choose a username"/>
        <span class="error-text"
          *ngIf="f['username'].touched && f['username'].errors?.['required']">
          Username is required
        </span>
        <span class="error-text"
          *ngIf="f['username'].touched && f['username'].errors?.['minlength']">
          Minimum 3 characters
        </span>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter email"/>
        <span class="error-text"
          *ngIf="f['email'].touched && f['email'].errors?.['required']">
          Email is required
        </span>
        <span class="error-text"
          *ngIf="f['email'].touched && f['email'].errors?.['email']">
          Enter a valid email
        </span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Create password"/>
        <span class="error-text"
          *ngIf="f['password'].touched && f['password'].errors?.['required']">
          Password is required
        </span>
        <span class="error-text"
          *ngIf="f['password'].touched && f['password'].errors?.['pattern']">
          Must be 6+ chars with at least one uppercase and one number
        </span>
      </div>

      <button type="submit"
              [disabled]="registerForm.invalid || isLoading"
              class="btn-primary">
        {{ isLoading ? 'Creating account...' : 'Register' }}
      </button>

    </form>

    <p class="register-link">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

  </div>
</div>
