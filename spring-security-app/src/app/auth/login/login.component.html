<div class="login-container">
  <div class="login-card">

    <h2>Sign In</h2>

    <!-- Error message -->
    <div class="error-alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- Username -->
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          formControlName="username"
          placeholder="Enter username"
          [class.is-invalid]="f['username'].invalid && f['username'].touched"
        />
        <span class="error-text"
          *ngIf="f['username'].touched && f['username'].errors?.['required']">
          Username is required
        </span>
        <span class="error-text"
          *ngIf="f['username'].touched && f['username'].errors?.['minlength']">
          Minimum 3 characters
        </span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          [class.is-invalid]="f['password'].invalid && f['password'].touched"
        />
        <span class="error-text"
          *ngIf="f['password'].touched && f['password'].errors?.['required']">
          Password is required
        </span>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="loginForm.invalid || isLoading"
        class="btn-primary">
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <!-- Google OAuth2 -->
    <div class="divider">or</div>
    <a href="http://localhost:8080/oauth2/authorization/google"
       class="btn-google">
      Sign in with Google
    </a>

    <!-- Register link -->
    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">Register here</a>
    </p>

  </div>
</div>
